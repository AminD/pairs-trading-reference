[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading"
version = "1.0.0"
description = "Pairs trading: cointegration tests, Kalman-filter hedge ratios and a walk-forward backtest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "statsmodels>=0.14", "matplotlib>=3.8"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8.0", "ipykernel>=6.0"]

[tool.setuptools]
packages = ["pairs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
